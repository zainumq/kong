[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun" # BSC supports Cancun (incl. MCOPY) since the Haber hardfork, Jun 2024; OZ v5.7 requires it
# Full-sale tests mint 10,000 passes in one test tx (~600M gas); raise the
# test gas limit well above the 30M default. Does not affect gas reporting.
gas_limit = 5000000000

[profile.default.fuzz]
runs = 256
